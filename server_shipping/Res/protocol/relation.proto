syntax = "proto3";
package faith;

message relation_proto
{

	//#client req add friend
	//@cg
	message c2s_addfriend
	{
		uint64 guid = 1;			//玩家guid
		int32 relation_type = 2;	//添加类型
		int32 server_id = 3;		//服务器id
	}

	message c2s_operate_other_add_req
	{
		uint64 sender_guid	= 1;	//发送者的guid
		bool  is_add = 2 ;			//是否添加
		repeated uint64 operate_guid = 3;			//玩家guid
	}

	//#server ret add friend
	//@gc
	message s2c_addfriend
	{
		uint64 guid = 1;			//玩家guid
		string name = 2;			//名字
		repeated int32 	data_array = 3;		//其他信息
	}

	message s2c_otheraddfriend
	{
		uint64 guid = 1;			//玩家guid
		string name = 2;			//名字
		string gs_value = 3;		//战力
		repeated int32 	data_array = 4;		//其他信息
	}

	//#client req del friend
	//@cg
	message c2s_delfriend
	{
		uint64 guid = 1;			//玩家guid
		uint32 friendtype = 2;		//好友类型
	}

	//#client req update friend userinfo
	//@cg
	message c2s_req_friend_userinfo
	{
		int32 sub_type = 1;
		string name = 2;			//名字
	}

	//#server ret update friend userinfo
	//@gc
	message friend_user_info
	{
		uint64 guid = 1;			//玩家guid
		string name = 2;			//名字
		string gs_value = 3;		//战力
		repeated int32 data_array = 4;		//好友数据
	}
	message s2c_ret_friend_userinfo
	{
		bool is_search 			  = 1;//是否是搜索好友
		repeated friend_user_info friend_list = 2;//好友列表
	}

	//#server ret del friend
	//@gc
	message s2c_delfriend
	{
		uint64 guid = 1;			//被删掉的guid
	}

	//#server syc one friend state
	//@gc
	message s2c_syc_friend_state
	{
		uint64 guid = 1;			//玩家guid
		int32 state = 2;			//状态
	}

	//#server syc full friends list
	//@gc
	message s2c_syc_full_friendlist
	{
		repeated friend_user_info friend_full_list_info = 1;		//好友列表满了
	}

	//#server syn lover info
	//@gc
	message s2c_syn_loverinfo
	{
		uint64 loverguid = 1;		// guid
		uint64 sender_guid	= 2;	//发送者的guid
	}

	message s2c_syc_full_other_req_list
	{
		repeated friend_user_info  	full_other_req_list_info = 1;
	}
	

	//#client req add friendliness
	//@cg
	message c2s_add_friendliness_value
	{
		uint64 sender_guid      	 = 1;			//发送者的guid
		uint64 addreessee_guid	 	 = 2;			//接收方的guid
		uint64 gift_id	 	 		 = 3;			//发送的礼物ID
		uint64 gift_count		 	 = 4;			//发送的礼物数量
		string chat_message         = 5;			//sender的留言
	}

	//#server ret add friendliness
	//@gc
	message s2c_ret_friendliness_value
	{
		uint64 relation_guid	 	 	= 1;			//好友的guid
		uint64 relation_friendliness 	= 2;			//好友的友好度
		uint64 gift_id	 	 		 	= 3;			//发送的礼物ID
		uint64 gift_count		 		= 4;			//发送的礼物数量
	}

	message c2s_req_syc_relation_state
	{
		uint64 sender_guid				= 1;			//请求者guid
	}
	message ret_relation_state
	{
		uint64 relation_guid		= 1;			//好友guid
		uint64 relation_state       = 2;			//状态
		uint64 relation_login_time  = 3;			//最后一次登陆时间
		int32 exp_level 			= 4;			//好友数据
	}
	message s2c_ret_relation_state
	{
		repeated ret_relation_state full_relation_state = 1;	//列表中所有人的状态
	}


	//先临时这么处理陌生人的状态更新
	message c2s_req_syc_nearly_state
	{
		uint64 sender_guid 	= 1;	
		repeated uint64 stranger_guid 	= 2;	//更新最近中陌生人的状态
	}
	message s2c_ret_syc_nearly_state
	{
		repeated ret_relation_state full_stranger_state = 1;	//更新最近中陌生人的状态
	}

	message s2c_ret_operate_relation_result
	{
		int32 result_id =  1;					//进行好友操作相关的结果id返回，0是成功。
	}


	//-----------------------------------------------------------
	//#server send add relation
	//gc
	message s2c_add_relation_info
	{
		int32	relation_list_type = 1;			//关系列表的类型
		uint64 guid = 2;			//玩家guid
		string name = 3;			//名字
		string gs_value = 4;		//战力
		repeated int32 	data_array = 5;		//其他信息
	}

	//#server send del relation
	//gc
	message s2c_del_relation_info
	{
		int32		relation_list_type = 1;		//关系列表的类型
		uint64 	guid = 2;					//玩家guid
	}

	//#server send full relation list info
	//gc
	message s2c_syc_full_relation_list
	{
		repeated friend_user_info  	full_relation_list_info = 1;	//列表中全部关系人的信息
	}


	//------------------- marry ----------------------------------------
	message s2c_marry_operate_result
	{
		int32 operate_result_type = 1;				//操作结果
		int32 support_id		   = 2;
	}

	//#client ask about marrage
	//@cg
	message c2s_req_marrage
	{ 
		uint64 main_guid	= 1;	//队长的guid 
		uint64 sub_guid	= 2;	//couple guid 
		int32	marry_item	= 3;	//结婚道具id
	}

	//#server ret about marrage
	//@gc
	message s2c_ret_marrage
	{
		uint64		couple_guid			= 1;
		string		couple_name			= 2;
		int32		marry_state			= 3;
		int32		save_event_time		= 4;
	}

	message c2s_reply_choose
	{ 
		uint64 role_guid	= 1;	 
		bool   is_agree	= 2; 
		bool   is_divorce	= 3;
		bool	is_force    = 4;	
	}
	//申请情侣信息
	message c2s_req_couple
	{
		uint64 role_guid	= 1;	//sender
	}
	//回复情侣信息
	message s2c_ret_couple_info
	{ 		
		uint64 main_guid		= 1;	//  
		string main_name		= 2;	// 
		int32  main_class_id	= 3;	// 
		int32  main_level		= 4;	// 
		uint64 couple_guid		= 5;	//  
		string couple_name		= 6;	// 
		int32  couple_class_id	= 7;	// 
		int32  couple_level	= 8;	// 
		int32  save_time		= 9;	// 
		int32  marry_state		= 10;	// 
	}

	message c2s_req_divorce
	{ 
		bool	is_force	= 1;	//是否强制离婚
		uint64 main_guid	= 2;	//队长的guid 
		uint64 sub_guid	= 3;	//couple guid  
	}
  
	message c2s_req_marry_get_reward	
	{  
		uint64 role_guid	= 1; 
	}
   
   	message s2c_send_marry_effect_notice	
	{
		int32 effect_level	= 1;		//特效等级是信物的品质
	}
	message c2s_req_get_marry_mission
	{
		int32 is_near	= 1;
	}
	message s2c_confirm_receive_marry_mission
	{
	
	}
	message c2s_confirm_receive_marry_mission
	{
		int32 is_receive= 1;
	}
	message c2s_req_upgrade_wedding_ring	
	{
		int32 use_item_id	= 1;		//使用的物品
	}

	message s2c_upgrade_wedding_ring_result	
	{
		int32 result	= 1;		//操作结果
	}

	message s2c_update_marry_info
	{
		string couple_name		= 1;
		int32  marry_time		= 2;
	}

	message c2s_req_bless_one_couple
	{
		int32 target_guid_a	= 1;	//其中一个玩家的id
		int32 target_guid_b	= 2;	//其中一个玩家的id
	}

	message s2c_bless_one_couple_result	
	{
		int32 result	= 1;		//操作结果
	}
	message c2s_get_marry_examination
	{
		int32 is_near= 1;
	}
	message s2c_confirm_marry_examination
	{
	
	}
	message c2s_confirm_marry_examination
	{
		int32 is_receive= 1;
	}
	message c2s_operate_marry_examination
	{
		int32 operate_type= 1;
		int32 ext_param_1 = 2;
		int32 ext_param_2 = 3;
	}
	message s2c_sync_marry_examination
	{
		int32 dati_id= 1;
		int32 dati_num= 2;
		int32 dati_right_num= 3;
		int32 heart_value = 4;
		int32 dati_stage = 5;
	}
	message s2c_sync_marry_heart_value
	{
		int32 heart_value = 1;
	}
	message s2c_operate_marry_examination
	{
		int32 operate_type = 1;
		int32 result = 2;
		int32 couple_answer = 3;
		int32 my_answer = 4;
	}

	message c2s_req_use_fireworks
	{
		int32 obj_guid_a = 1;
		int32 obj_guid_b = 2;
		string target_name = 3;
		string target_blessing = 4;
	}

	message c2s_req_lucky_info
	{
		int32 req_type = 1;	//请求结缘信息 1:请求推荐列表 2:请求获取命中注定 3:购买次数
	}

	message lucky_role_info
	{
		int32 role_guid_a	= 1;
		int32 role_guid_b	= 2;
		string role_name	= 3;
		int32 role_vip		= 4;
		int32 role_template= 5;
		int32 role_level	= 6;
		string role_fight	= 7;
		string role_time	= 8;
		string role_desc	= 9;
	}

	message s2c_ret_lucky_info_vec
	{
		repeated lucky_role_info user_info = 1;
	}

	message s2c_ret_special_lucky_info
	{
		int32 role_guid_a	= 1;
		int32 role_guid_b	= 2;
		string role_name	= 3;
		int32 role_template= 4;
	}


}	 

