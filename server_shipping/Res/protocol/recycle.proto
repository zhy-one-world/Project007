syntax = "proto3";
package faith;

message recycle_proto
{

	message recycle_reward_one
	{
		int32 recycle_id	= 1;
		int32 state        = 2;
		
	}
	message recycle_item_one
	{
	    int32  recycle_id   = 1;
		int32  finish_num   = 2;
		int32  state        = 3;
	}
	message recycle_data_all
	{
	    int32   start_time                        = 1;
		repeated recycle_item_one    task_array		       = 2;
		repeated recycle_reward_one  login_array           = 3;
		repeated recycle_reward_one  buy_array             = 4;
		repeated recycle_reward_one  invited_level_array   = 5;
		repeated int32   params                            = 6;
	}
	message recycle_operate
	{
		int32 recycle_id			= 1;
		int32 oper_type			= 2;          // 
	}
	message recycle_operate_end
	{
	    int32 recycle_id          = 1;
		int32 oper_type           = 2;
		int32 result	           = 3;
	}
	message recycle_invited_reward 
	{
	   string inviter_guid        = 1;
	}
	
	message recycle_invited_reward_end 
	{
	   int32  result             = 1;
	}
	
	message recycle_invited_one
	{
	   repeated int32  guid               = 1;
	   int32  level              = 2;
	   int32  head_id            = 3;
	   int32  grade_level        = 4;
	   string invited_name       = 5;
	}
	
	message recycle_invited_list 
	{
	   repeated recycle_invited_one  invited_array = 1;
	}
}

