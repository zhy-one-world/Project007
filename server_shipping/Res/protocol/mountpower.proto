syntax = "proto3";
package faith;

message mount_power_proto
{


	message mount_power_operate
	{
		repeated int32 item_guid			= 1;
		int32 oper_type			= 2;
		int32 slot			        = 3;
		int32 item_a			    = 4;
		int32 item_b               = 5;
	}
	message mount_power_operate_end
	{
		repeated int32 item_guid					        = 1;
		int32 oper_type						    = 2;
		int32 slot                                 = 4;
		int32 result                               = 3;
	}
}

