syntax = "proto2";
package hld;

message mount_power_proto
{


	message mount_power_operate
	{
		repeated int32 item_guid			= 1;
		optional int32 oper_type			= 2;
		optional int32 slot			        = 3;
		optional int32 item_a			    = 4;
		optional int32 item_b               = 5;
	}
	message mount_power_operate_end
	{
		repeated int32 item_guid					        = 1;
		optional int32 oper_type						    = 2;
		optional int32 slot                                 = 4;
		optional int32 result                               = 3;
	}
}