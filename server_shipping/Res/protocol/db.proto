syntax = "proto2";
package hld;

message db_proto
{
	message role_starark_db
	{
	   repeated int32  data_ary = 1;
	   optional string body = 2;
	}
    message role_proc_recycle_invited_row
    {
	   optional int64  role_guid = 1;
	   optional int32  level = 2;
	   optional int32  head_id= 3;
	   optional int32  class_type =4;
	   optional string invited_name = 5;	
    }
    message role_proc_recycle_invited_db
    {
	   optional int32 row_count = 1;
	   repeated role_proc_recycle_invited_row row_data = 2;
    }

    message role_event_db
    {
	   repeated int64  data_ary = 1;
    }
	
	message item_info_db
	{
	   optional int64 item_guid = 1;
	   repeated int32 data_ary = 2;
	   optional string param_str = 3;
	}

    message auction_row
    {
	   optional int64  seller_guid = 1;
	   optional string seller_name = 2;
	   optional int64  buyer_guid = 3;
	   optional string buyer_name = 4;
	   optional int32  trade_type = 5;
	   optional	int32  seller_vip_level = 6;
	   optional	int32  auction_type = 7;
	   optional	int32  auction_sub_type = 8;
	   optional int32  item_color = 9;
	   optional	int32  quality_level = 10;
	   optional	int32  class_limit = 11;
	   optional string item_name = 12;
	   optional	int64  sell_time = 13;
	   optional	int64  deal_time = 14;
	   optional	int32  sell_money_type = 15;
       optional	int64  sell_total_money = 16;
	   optional	int64  sell_single_money =17;
	   optional	int64  cur_bid_money = 18;
	   optional	int32  is_show = 19;
	   optional	int32  add_time = 20;
	   optional	int32  is_sky_order = 21;
	   optional int64  show_guid = 22;
	   optional item_info_db item_info = 23;
    }
    message auction_db
    {
	    optional int32 row_count = 1;
		repeated auction_row row_data = 2;
    }
	
	message role_first_time_do_row
	{
	   optional int32 do_type = 1;
	}

    message role_first_time_do_db
    {
	    optional int32 row_count = 1;
		repeated role_first_time_do_row row_data = 2;
    }

    message load_role_guide_row
    {
	    optional int32 guide_trigger_id = 1;
		optional int32 state = 2;
    }
    message load_role_guide_db
    {
	    optional int32 row_count = 1;
		repeated load_role_guide_row row_data = 2;
    }

    message role_mail_row
    {
	    optional int64  mail_guid = 1;
		repeated int32  data_ary = 2;
		optional string text_contents = 3;
		optional string sender_name = 4;
		optional string mail_title =5;
    }

    message role_mail_db
    {
	    optional int32 row_count = 1;
		repeated role_mail_row row_data = 2;
    }
	
    message role_mail_item_db
    {
	    optional int32 row_count = 1;
		repeated item_info_db row_data = 2;
    }	
 
}