syntax = "proto2";
package hld;

message mail_proto
{
	message mail_operation
	{
		repeated int32 mail_guid			=1;
		optional int32 operation_typ		=2;		
	}
	
	message mail_delete_these_mail
	{
		repeated int32 mail_guid			=1;
	}
	
	message mail_del_by_live_time_info
	{
		repeated int32 mail_guid			=1;
		optional int32 mail_num				=2;		
	}
	
	
	message mail_info
	{
		repeated int32	mail_guid			= 1;
		repeated int32  mail_data			= 2;
		optional string text_contents		= 3;
		optional string sender_name			= 4;
		optional string mail_title			= 5;
	}
	
	message item_info
	{
		repeated int32	item_guid			= 1;				// 物品guid
		repeated int32	item_data			= 2;				// 物品数据
	}
	
	message mail_sending_info						//邮件发送中，带有物品实例数据的邮件数据
	{
		optional mail_info	mail_info		= 1;
		repeated item_info  item_info		= 2;	//附件物品实例数据
	}
	
	
	message mail_send_mail
	{
		repeated int32 mail_item_guid		=1;
		repeated int32 addressee_guid		=2;
		optional int32 monye_typ_1			=3;
		optional int32 monye_value_1		=4;
		optional int32 monye_typ_2			=5;
		optional int32 monye_value_2		=6;	
		optional string mail_title			=7;
		optional string text				=8;
	}
	
	message mail_send_mail_to_all_player
	{
		repeated int32 mail_item_guid		=1;
		optional int32 monye_typ_1			=3;
		optional int32 monye_value_1		=4;
		optional int32 monye_typ_2			=5;
		optional int32 monye_value_2		=6;	
		optional string mail_title			=7;
		optional string text				=8;
	}
	
	
	message mail_operation_end
	{
		optional int32 operation_state		=1;
		optional int32 operation_typ		=2;
		repeated int32 mail_guid			=3;
		repeated int32 role_guid			=4;
	}
	
	
	message update_mail
	{
		repeated int32	role_guid			= 1;
		optional uint32	mail_error			= 2;
		repeated mail_info	mail_list		= 3;
		optional bool	is_over				= 4;
		optional bool	is_need_clear		= 5[default = false];
	}
	
	message mail_contents_get
	{
		repeated int64 money_get_info		=1;
		repeated int32 item_get_info		=2;
	}
}