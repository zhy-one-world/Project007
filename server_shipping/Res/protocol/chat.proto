syntax = "proto3";
package faith;

message chat_proto
{
	message chat_item_info
	{
		repeated int32					item_guid	= 1;				// 物品guid
		repeated int32					item_data	= 2;				// 物品数据
	}
	
	message notice_info	
	{			
		repeated int32					role_guid		= 1;
		int32					notice_id		= 2;
		int64					sender_template_id	= 3;
		int32					create_time		= 4;
		string					final_string	= 5;
		repeated int32					item_data		= 6;
	}
	
	message chat_text	
	{			
		repeated int32					sender_guid		= 1;
		string					text			= 2;
		int32					chat_typ	 	= 3;
		repeated int32					addressee_guid	= 4;
		string					addressee_name	= 5;
		repeated chat_item_info			item_list		= 6;
		string					sender_name	 	= 7;
		int32					text_num		= 8;
	}
	

	message chat_text_and_item	
	{			
		repeated int32					role_guid	= 1;
		string					text		= 2;
		repeated chat_item_info			item_list	= 3;
	}
	
	message chat_result	
	{			
		int32					chat_result_id	= 1;
		int32					chat_type		= 2;
	}
	
	
	message chat_content_info
	{
		string					CommonText	= 1;	// 普通文字		
		repeated int32					item_data	= 2;				// 物品数据
		repeated float					location	= 3;				// 位置信息
		int32					line_id		= 4;				// 线路ID
		int32					map_id		= 5;				// 坐标的地图ID	
		string					audio_id    = 6; 				// 音频上传ID	
		int32					audio_duration_time	= 7;		// 音频持续时间
		int32					template_id = 8;				// 文本表id
		int32					face_finish_img_id = 9;			// 表情结束图片id
	}
	
	message chat_content	
	{
		int64					sender_guid					= 1;
		int32					sender_template_id			= 2;
		repeated chat_content_info		content_info_array			= 3;
		int32					chat_typ	 				= 4;
		repeated int32					addressee_guid				= 5;
		string					addressee_name				= 6;
		string					sender_name	 				= 7;
		int32					relation_template_id	 	= 8;
		int32					relation_level				= 9;
		int64					chat_guid					= 10;
		bool					is_finish_send				= 11;
		int32					server_id					= 12;
		int32					is_radio_host				= 13;
		int32					vip_title_template_id		= 14;
		int32					head_frame_id				= 15;
		string					common_string				= 16;
		int32					sender_guid_a				= 17;	//server
		int32					sender_guid_b				= 18;	//server
		int32					chat_guid_a					= 19;	//server
		int32					chat_guid_b					= 20;	//server
	}	
	
	
	message recruit_info	
	{
		int64					team_guid					= 1;
		int32					aim_type					= 2;
		int32					aim_sub_id		 			= 3;
		int32					recruit_type				= 4;
		int32					one_dragon_flag				= 5;
	}
	
	message receive_recruit_info	
	{
		int64					team_guid					= 1;
		int32					aim_type					= 2;
		int32					aim_sub_id	 			    = 3;
		int32					recruit_type				= 4;
		int32					request_fighting_power		= 5;
		int32					request_level						= 6;
		int32					cur_member_num				= 7;
		int32					max_member_num	 			= 8;
		int64					sender_guid					= 9;
		string					sender_name					= 10;
		int32					sender_template_id			= 11;
		int32					one_dragon_flag				= 12;
	}
	
	message recruit_team_member_num	
	{
		int64					team_guid					= 1;
		int32					cur_member_num				= 2;
		int32					max_member_num	 			= 3;
	}
	
	message recruit_end_info	
	{
		int32					recruit_result				= 1;
		int32					recruit_type				= 2;
	}
	
	message receive_legion_recruit_info	
	{
		int64					legion_guid					= 1;
		string					legion_name					= 2;
		int64					sender_guid					= 3;
		string					sender_name					= 4;
		bool					is_when_create				= 5;
		string					legion_master_name			= 6;
		int32					legion_level				= 7;
		int32					sender_template_id			= 8;
	}
	
	message audio_info
	{
		int64 					audio_guid					= 1;
		string					audio_content				= 2;  // to be converted to byte[]
	}

	message quick_chat_content
	{
		int64					sender_guid					= 1;
		int32					chat_template_id			= 2;
		int32					chat_typ	 				= 3;
		int64					addressee_guid				= 4;
		string					addressee_name				= 5;
		string					sender_name	 				= 6;
	}
	
	message notice_info_with_param
	{
		string					sender_name					= 1;
		int64					sender_guid					= 2;
		int64					sender_template_id			= 3;
		string					content_text	 			= 4;
		repeated int32					param_array	 				= 5;
		int32					param_type	 				= 6;
		int32					chat_type					= 7;
		int32					notice_id					= 8;
		int32					create_time					= 9;
	}
	
	message receive_top_tip	
	{
		int32					string_id				= 1;
		int32					top_tip_type			= 2;
	}
	
	message	join_voice_channel
	{
		int32					channel_type			= 1;
	}
	message	join_voice_channel_end
	{
		int32					channel_type			= 1;
	}
	message	invite_join_voice_channel
	{
		int64					role_guid				= 1;
		int32					channel_type			= 2;
	}
	message	join_or_leave_voice_channel_notice
	{
		int32					channel_type			= 1;
		string					role_name				= 2;
		bool					is_join					= 3;
	}
	message chat_one_record
	{
		int32               pos		= 1;
		string              record     = 2;
	}
	message chat_all_record
	{
	   repeated int32               role_guid	= 1;
	   repeated chat_one_record     chat_array  = 2;   
	}
	message chat_record_oper
	{
	   int32              pos       = 1;
	   string             record    = 2;
	}
	message chat_record_oper_end  
	{
	   int32             pos = 1;
	   int32             result = 2;
	}
	
	// 发送预约
	message send_subscribe_daily 
	{
	   int32  		  must_do_type = 1;
	}
	
	// 预约返回结果
	message send_subscribe_daily_end
	{
	   int32  		  result = 1;
	}
	
	// 发送预约信息
	message send_subscribe_daily_info  
	{
	   repeated subscribe_daily_info    info_list = 1;
	}
	
	// 预约信息结构
	message subscribe_daily_info  
	{
	   int32             dailt_type = 1;
	   int32             info_state = 2;
	}
}

