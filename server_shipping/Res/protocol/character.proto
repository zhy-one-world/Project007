syntax = "proto3";
package faith;

message character_proto

{
	message enum_character	
	{			
		string				account = 1;
		int32				area_id = 2;
	}
	
	message enum_character_end_info
	{
		int32				last_role				= 1;	// 是否是最后一个角色
		int64				role_guid				= 2;			// 角色guid
		string				name					= 3;			// 名字
		string				appearance				= 4;			// 名字
		uint32				gender					= 5;	// 性别
		uint32				char_class				= 6;	// 职业 枚举值见玩家属性头文件
		uint32				template_id				= 7;	// 模板id
		uint32				exp_level				= 8;	// 经验等级
		uint32				is_select				= 9;	// 是否被选中
		uint32				del_time				= 10;	// 删除时间
		uint32				wing_id					= 11;	// 删除时间
		uint32				mount_id				= 12;	// 删除时间
		repeated int32				buff_info				= 13; //buff实例数据
		int64				spirit_guid				= 14;	//精灵GUID
		int32				spirit_template_id		= 15;	//精灵ID
		int32				spirit_illusion_index	= 16;	//精灵幻化
		int32				spirit_upgrade_count	= 17;	//精灵升级
		repeated enum_character_item		item_info		= 18;	// 物品实例数据
		int64				login_out_time			= 19;	//最后下线时间
		int32				show_fashion			= 20;
		int32				head_frame_id			= 21;
		int32				appearance_id			= 22;	//id
		int32              is_only_create_role     = 23;   // 开启创建角色
	}
	
	message enum_character_item
	{
		repeated int64				item_guid				= 1; //物品guid
		repeated int32				item_ary				= 2; //物品实例数据
	}
	message create_character
	{
		string				account					= 1;
		int32				area_id					= 2;
		string				name					= 3;					// 名字
		uint32				gender					= 4;		// 性别
		uint32				race					= 6;		// 种族 枚举值见玩家属性头文件
		uint32				hair_style				= 7;		// 头型
		uint32				face_style				= 8;		// 脸型
		uint32				img_id					= 9;		// 头像id
		uint32				template_id				= 10;		// 模板id
		uint32				frame_quality			= 11;					// 画质设置
		string				appearance				= 12;					// 外观数据
	}

	message create_character_end
	{
		uint32				result					= 1;
		int64				role_guid				= 2;
		int64				create_time				= 3;
		string				role_name				= 4;
		repeated int32				role_info				= 5;
	}
	
	message delete_character
	{
		string				account					= 1;
		int64				role_guid				= 2;
		int32				del_type				= 3;
		int32				server_id				= 4;
	}

	message delete_character_end
	{
		int64				role_guid				= 1;
		uint32				del_time				= 2;
		uint32				del_type				= 3;
	}
	
	message unit_info_msg
	{
		int64				role_guid					= 1;	// 角色ID
		string				role_name					= 2;	// 名字
		string				role_appearance				= 3;	// 外形数据
		repeated int32				data_ary					= 4;	// 角色数据
		bool				is_refresh_by_zero			= 5;	// 零点刷新的推消息
		bool				is_refresh_by_special_time	= 6;	// 特殊时间刷新的推消息
		repeated string				data_str_ary				= 7;	// 战力
	}
	
	message unit_info_body_att
	{
		repeated int32				role_base_body_att			= 1;	// 力量 敏捷 智力 耐力
	}
	
	message role_info_one
	{
		int64				unit_guid				= 1;	//角色ID
		int32				info_type				= 2; 	//类型
		int32				info_value				= 3; 	//值
	
	}
		
	message role_i64_info_one
	{
		int64				unit_guid				= 1;	//角色ID
		int64				info_value				= 2; 	//战力值
		int32				info_type				= 3;	//类型
	}	
		
	message	att_one_level
	{
		repeated float				att_ary					= 1;	// 人物属性数组
	}
	
	message character_all_att
	{
		int64				unit_guid				= 1;	// 角色ID
		repeated double				attack_att				= 2;	// 战斗属性数组
		repeated float				game_att				= 3;	// 游戏内单个数据数值
		repeated bool				attack_state			= 4;	// 状态数组			
	}

	message	base_att_all
	{
		int64				unit_guid				= 1;	// 角色ID
		repeated int64				att_ary					= 2;	// 人物属性数组
	}
	
	message base_att_one
	{
		int64				unit_guid				= 1;	//角色ID
		int32				att_type				= 2; 	//类型
		int64				att_value				= 3; 	//值			
	}
	
	message	character_one_att_change
	{
		int32				attack_att_index		= 1;	//key
		double				attack_att_value		= 2;	//具体值
	}
	
	message character_one_att
	{
		int64				unit_guid				= 1;	//角色guid
		repeated int32				attack_att_index		= 2;	//key
		repeated double				attack_att_value		= 3;	//具体值
	}
	message unit_dead
	{
		int64				unit_guid				= 1;	//被杀者ID
		int64				killer_guid				= 2;	//凶手ID
		int32				skill_template_id		= 3;	//凶手使用的技能
		bool				is_dead					= 4;	//是否死亡
		bool				is_critical				= 5;	//是否暴击死亡
	}
	message ask_unit_dead
	{
		int64				unit_guid				= 1;	//被杀者ID
		int32				runtime_id				= 2;	//运行时数组下标
	}
	message character_money_all
	{
		int64				role_guid				= 1;	//角色guid
		repeated int64				money_value				= 2;	//货币的数量
	}
	
	message character_money_one
	{
		int64				role_guid				= 1;	//角色guid
		int32				money_id				= 2;	//货币类型
		int64				money_value				= 3;	//货币数量
	}
	
	message character_get_money
	{
		repeated int32				money_type_array		= 1;	//钱类型数组
		repeated string				money_num_array			= 2;	//钱数量数组
	}
	message character_time_all
	{
		int64				role_guid				= 1;	//角色guid
		repeated int64				time_value				= 2;	//时间
	}
	
	message character_time_one
	{
		int64				role_guid				= 1;	//角色guid
		int32				time_id					= 2;	//时间类型
		int64				time_value				= 3;	//时间
	}
	message character_logic_all
	{
		int64				role_guid				= 1;	//角色guid
		repeated int32				logic_value				= 2;	//逻辑数据
	}
	
	message character_logic_one
	{
		int64				role_guid				= 1;	//角色guid
		int32				logic_id				= 2;	//逻辑类型
		int32				logic_value				= 3;	//逻辑数值
	}
	message pos_vector
	{
		float			x				= 1;
		float			y				= 2;
		float			z				= 3;
	}

	message rot_angle
	{
		float			r				= 1;
		float			y				= 2;
		float			p				= 3;
	}
	
	message character_move
	{
		int64			unit_guid					= 1;			// 角色ID	
		pos_vector		position					= 2;			// 角色的位置坐标
		pos_vector		direction					= 3;			// 角色的速度
		rot_angle		rotator_angle				= 4;			// 角色的方向
	}

	message load_role_info_end
	{
		unit_info_msg		role_info				= 1;
		sint32 runtime_id  						= 2;
	}
	message character_warning
	{
		int64				unit_guid				= 1; 	// 人物guid
		int32       		warn_type	 		    = 2;	// 警告的类型
		int32       		warn_value	 		    = 3;	// 其他参数
		bool       		warn_show	 		    = 4;	// 显示1或隐藏0
	}
	
	message character_gmorder_message
	{
		int32        		command_type         = 1;  // 命令名称
		int32        		sub_command_type     = 2;  // 子命令
		repeated int32        		arg_int              = 3;  // int 参数数组
		repeated string       		arg_string           = 4;  // string 参数数组
		string       		command_string       = 5;  // string类型命令名称
	}
	
	message character_fuhuo
	{
		int32				mode					= 1;	// 复活参数( 原地复活和回城复活 );
	}

	message character_fuhuo_s2c
	{
		int64				role_guid				= 1;	// 人物guid
		int32				mode					= 2;	// 复活参数( 原地复活和回城复活 );
		int32				pos_x					= 3;
		int32				pos_y					= 4;
		int32				pos_z					= 5;
		int32				roll					= 6;
		int32				yaw						= 7;
		int32				pitch					= 8;
		int32				worldid					= 9;
		int32				lineid					= 10;		
	}
	
	message character_levelup
	{
		int64 role_guid	= 1; //人物guid
		int32 level_old	= 2;
		int32 level_new	= 3;
	}
	
	message map_fuben_over
	{
		int32				fuben_template_id		= 1;	// 副本的模板ID
		int32				pass_time				= 2;	// 通关时间
		int32				dead_count				= 3;	// 死亡次数
		int32				settle_level			= 4;	// 副本评级
		int32				assist_state			= 5;	// 助战状态(0不是助战 1是助战)
		repeated int32				reward_moneys			= 6;	// 通关金钱奖励(包括经验)
		int32				sub_type				= 7;	// 结算子类型
	}
	
	message map_money_bonus
	{
		int32				type 					= 1;
		int32				count 					= 2;
	}
	
	message map_arena_fuben_over
	{
		int64				role_guid 				= 1;	// 人物guid
		int32				fuben_template_id		= 2;	// 副本的模板ID
		int32				end_result				= 3;
		int32				final_rank				= 4;	// 新排名
		int32				exp_bonus				= 5;	// 经验
		int32				money_bonus				= 6;	// 金币
		int32				reputation_bonus		= 7;	// 声望
		int32				first_high_reward		= 8;	// 首创新高绑金
		int32				old_rank				= 9;	// 老排名
	}
	
	message map_fuben_send_notice
	{
		string				notice_content 			= 1;
	}
	
	message map_fuben_info_to_client
	{
		int32				wave_id					= 1;
		int32				cur_wave 				= 2;
		int32				total_wave 				= 3;
		int32				cur_npc 				= 4;
		int32				total_npc				= 5;
		int32				cur_map_state			= 6;
		int32				cur_player_num			= 7;
		int32				kill_monster_num		= 8;
	}
	
	message map_tigger_volume
	{
		int32				tigger_volume_id		= 1;
	}
	message s2c_game_over
	{
		int32				game_result				= 1;
	}
	message c2s_game_over
	{
		int32				unit_result				= 1;
	}
	
	message pick_drop_box
	{
		int64				drop_box_guid			= 1; 	//掉落包guid
		int32				runtime_id				= 2; 	//掉落包guid
	}
	
	message receive_reward
	{
		int64				role_guid				= 1; 	//人物guid
		int32				map_id					= 2; 	//人物所在地图guid
	}
	
	message bag_slot_open_info
	{
		int64              role_guid              		 = 1;    //人物guid
		int32              bag_slot_open_num      		 = 2;    //已经开启的物品栏格子数目
		int32              open_next_need_time    		 = 3;    //开启下一个物品栏格子需要的事件
		int32				storage_slot_open_num  		 = 4;
		int32   			open_storage_next_need_time  = 5;
	}
	
	message bag_unlock_slot_req
	{
		int64              role_guid                        	= 1;
		int32              bag_slot_index_want_to_unlock   	= 2;
		int32				storage_slot_index_want_to_unlock   = 3;
	}
	message spirit_info
	{
		int64	spirit_guid			= 1;			// 精灵guid
		repeated int32  spirit_data			= 2;	
	}
	
	message spirit_system_info
	{
		int32	crystal				= 1;			// 灵晶
		int32	score				= 2;			// 兑换积分
		int32  last_free_time  	= 3;			// 上次免费抽奖时间
	}
	
	message update_spirit
	{
		int64	role_guid			= 1;
		uint32	spirit_error		= 2;
		repeated spirit_info	spirit_list	= 3;			// 精灵列表
	}
	
	message update_free_hunt_time
	{
		int64	role_guid			= 1;
		int32	last_free_hunt_time	= 2;
	}
	
	message spirit_system_operation
	{
		int64	role_guid			= 1;
		uint32	operation_type		= 2;
		int32	operation_value		= 3;
	}
	
	message spirit_qiyuan_level
	{
		int64	role_guid			= 1;
		int32	grade_qiyuan		= 2;
		int32	flair_qiyuan		= 3;
	}
	
	message spirit_jiban_list
	{
		int64	role_guid			= 1;
		repeated int32	jiban_trigger_list	= 2;
		repeated int32	jiban_almost_list	= 3;
	}
	
	message spirit_auto_sell_reward
	{
		int64	role_guid			= 1;
		repeated int32	money_list			= 2;
	}
	
	message spirit_operation
	{
		uint32	operation_type		= 1;
		repeated int32	spirit_guid			= 2;
		int32	target_slot			= 3;
	}
	
	message spirit_operation_end
	{
		repeated int32	role_guid			= 1 ;
		repeated int32	spirit_guid			= 2 ;
		int32	operation_type		= 3 ;
		int32  operation_result    = 4 ;
		int32	target_operate_slot	= 5 ;
	}
	message money_operation
	{
		int32	operation_target	= 1;
		int32	operation_value		= 2;	
	}
	
	message money_operation_end
	{
		int32	operation_target	= 1;
		int32	operation_value		= 2;	
		bool	operation_state		= 3;
	}
	
	message spirit_operation_tidy
	{
		repeated int32 spirit_guid_list         = 1;
	}
	
	message exchange_item
	{
		int32	spirit_exchange_id		= 1;
		int32	spirit_exchange_index	= 2;
	}
	
	message exchange_report
	{
		int32	exchange_state			= 1;
		int32	exchange_fail_msg		= 2;
		int32	item_template_id		= 3;
	}

	message addition_buff_all
	{
		repeated int32              role_guid                	= 1;   // 人物guid
		repeated int32              buff_id         		= 2;   // 加持BUFF的模板id
	}
	
	message addition_buff
	{
		repeated int32              role_guid                = 1;   // 人物guid
		int32              addition_buff_type       = 2;   // 背包界面中加持BUFF的类型
		int32              addition_buff_id         = 3;   // 加持BUFF的模板id
	}
	
	message character_grade_up
	{
		int32              class_change                = 1;   // 转职到哪个系
		int32				skill_template_id		 	= 2;   // 选择的技能
		int32 				grade_type					= 3;   // 转职类型
	}
	
	message character_grade_up_end
	{
		int64              role_guid                = 1;   // 人物guid
		int32              result_code              = 2;   // 操作的结果代码，用来反馈操作成功或错误
		int32              old_equip_buff_id        = 3;   // 旧装备buff ID
		int32              new_equip_buff_id        = 4;   // 新装备buff ID
		int32 				skill_template_id		 = 5;	// 获得的技能 ID
	}
	
	message character_error
	{
		repeated int32              role_guid                = 1;   // 人物guid
		int32              error                    = 2;   // 错误代码
	}
	
	message lucky_draw
	{
		int32              fuben_template_id        = 1;   // 副本模板ID
	}
	
	message lucky_draw_end
	{
		int32              item_template_id         = 1;   // 抽到的物品的模板ID
		int32              item_num                 = 2;   // 物品的数量
		bool				send_mail				 = 3;	// 物品是否是通过邮件发送的
	}
	
	message mopping_up
	{
		repeated int32              role_guid                           = 1;   // 角色GUID
		int32              raid_template_id                    = 2;   // 副本GUID
		int32              auto_convert_equip_to_magic_crystal = 3;   // 是否自动将扫荡获得的装备转化为魔晶(0不转化 1转化)
		int32              mopping_up_count                    = 4;   // 扫荡次数
	}
	
	message all_mopping_up
	{
		repeated int32              raid_template_id                    = 1;   // 副本id
		repeated int32              mopping_up_count					= 2;   // 扫荡次数
	}
	
	message mopping_up_award
	{
		repeated int32				item_info_array				= 1;	// 扫荡得到的物品
		repeated int32				money_info_array			= 2;	// 扫荡得到的钱币
		bool				is_send_mail				= 3;	// 奖励是否是通过邮件发送的
	}
	
	message mopping_up_end
	{
		int32              result                   = 1;   // 扫荡结果
	}
	
	message mopping_up_demons_tower
	{
		repeated int32              role_guid                = 1;   // 角色GUID
	}
	
	message mopping_up_demons_tower_get_award
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		bool				is_resolve				 = 2;	//是否自动分解
		
	}
	
	message mopping_up_demons_tower_get_award_end
	{
		int32              result                   = 1;   // 操作结果码
	}
	
	message pk_mode_change
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		int32				pk_info_type			 = 2;	// 1-pk模式,2-阵营
		int32              pk_info_value          	 = 3;   // 
	}
	
	message pk_mode_change_end
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		int32				pk_info_type			 = 2;	// 1-pk模式,2-阵营
		int32              pk_info_value          	 = 3;   // 
	}
	
	message pk_fight_back_sync
	{
		int32				fight_back_state		 = 1;	// 反击状态
	}
	
	message update_communities
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		repeated int32				community_state			 = 2;	//是否加入了此阵营
	}
		
	message start_meditation
	{
		repeated int32              role_guid                = 1;   // 角色GUID
	}
	
	message start_meditation_end
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		bool				is_player_active		 = 2;	// 是否是玩家点击冥想按钮主动触发
	}
	
	message stop_meditation
	{
		repeated int32              role_guid                = 1;   // 角色GUID
	}
	
	
	
	message get_meditation_reward
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		int32				get_type			 	 = 2;	// 获取奖励类型
	}
	
	message get_meditation_reward_end
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		int32				get_type			 	 = 2;	// 获取奖励类型
		int32				endType			 	 	 = 3;	// 返回结果
	}
	
	message daily_must_do_remain_info
	{
		repeated int32              role_guid				 = 1;    //角色GUID
		int32				role_level				 = 2;	// 角色等级
		int32				save_time				 = 3;	// 存储时间
		int32				vip_level 				 = 4;	// VIP等级
		int32              arena_rank               = 5;   // 竞技场排名
		repeated int32              data_array               = 6; 	// 数据数组
	}
	
	message update_three_day_must_do_remain
	{
		repeated int32                        role_guid				             = 1;    //角色GUID
		repeated daily_must_do_remain_info    remain_three_day_must_do           = 2;	 //剩余每日必做
	}
	
	message daily_must_do_count
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		int32							must_do_type	 	         = 2;	 // 类型
		int32							must_do_value						 = 3;  //值
		repeated int32              data_array               = 4; 	// 数据数组
	}
	
	message daily_must_do_count_all
	{
		repeated int32              role_guid                = 1;   // 角色GUID
		repeated int32              data_array               = 2; 	// 数据数组
	}
	
	message find_back_must_do_resource
	{
		repeated int32              role_guid                = 1;   // 角色GUID
