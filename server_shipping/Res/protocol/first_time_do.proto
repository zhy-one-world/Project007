syntax = "proto3";
package faith;

message first_time_do_proto
{
	message first_do_record
	{
		int32				do_type					= 1;
	}

	message update_first_time_do_records
	{
		int32				records_num				= 1;
		repeated first_do_record	records					= 2;
	}

	message add_first_time_do_record
	{
		int32				do_type					= 1;
	}
	
	message sync_first_time_do_record
	{
		first_do_record	record					= 1;
	}
}


