syntax = "proto3";
package faith;

message game_proto
{	
	///////////////////////// 消息和消息回?//////////////////////////
	message enter_game
	{
		int64	                role_guid			= 1;
		string					account				= 2;
		int32					line_id				= 3;
	}

	message enter_game_end
	{
		uint32			result				= 1;
		int32			server_type			= 2;
	}

	message pos_vector
	{
		float			x					= 1;
		float			y					= 2;
		float			z					= 3;
	}

	message rot_angle
	{
		float			x					= 1;
		float			y					= 2;
		float			z					= 3;
	}

	message pawn_att
	{
		
	}

	enum enter_scene_type
	{

		enter     = 0;   //进入游戏 
		transfer  = 1;   //传送
 	}

	message enter_scene
	{	
		enter_scene_type       type             = 1;          // 0:游戏登陆 1 		
	}

	message enter_scene_end
	{
		uint32 result = 1;  
	}

	message transfer_scene
	{
		uint32 map_template_id = 1; // 目标地图id
		uint32 line_id = 2;//线id
		uint32 group_id = 3;
		repeated uint32 map_guid = 4;
		int32	war_index = 5;
	}
	
	message transfer_scene_pos
	{
		uint32 map_template_id = 1; // 目标地图id
		uint32 line_id = 2;//线id
		repeated uint32 map_guid = 3;
		repeated int32	location = 4;
		repeated int32	rotation = 5;
	}
	
	message transfer_scene_born
	{
	}
	
	message reconnect_enter_scene_end
	{
		int32 result = 1;  
	}
	
	message line_list
	{
		repeated	int32	line_id = 1;
	}
	
	message transfer_scene_end
	{
		uint32			result				= 1;  // 成功的话返回后续信息      
		uint32			scene_uid			= 2;	             // 角色所在场景id
		pos_vector		position			= 3;	             // 角色的位置坐标
		rot_angle		rotator_angle		= 4;	             // 角色的朝向
	}
	
	message trans_local_scene_end
	{
		int64	        role_guid			= 1;
		pos_vector		position			= 2; // 角色的位置坐标
		rot_angle		rotator_angle		= 3; // 角色的朝向
	}
	
	message client2fep_ping
	{
		int64	client_time = 1;
	}

	message fep2client_ping
	{
		int64	client_time = 1;
		int64	server_time = 2;
	}

	message client2cs_ping
	{
		int64	trace_time = 1;
		int64	trace_time_2 = 2;
		int64	trace_time_3 = 3;
	}

	message cs2client_ping
	{
		int64	trace_time = 1;
		int64	trace_time_2 = 2;
		int64	trace_time_3 = 3;
	}

	message version_wrong
	{
	}
	
	
	message set_timekeeping
	{
		int32          time            = 1;        // 准备计时的时间
		int32			prefix_text		= 2;		// 前缀说明文字(为0表示不改变)
	}
	
	message wave_trigger_message
	{
		int32          message         = 1;        // 某一波怪能够触发的消息代号
	}

	message game_state
	{
		int32          state				= 1;
		int32          state_time			= 2;
		int32          cur_server_time		= 3;
	}

	message boss_state
	{
		int32			boss_id         = 1;        // boss的模板ID
		int32			boss_state_code = 2;        // boss的状态代?0表示BOSS没出?1表示BOSS出现 2表示BOSS被杀死而消?3表示BOSS未被杀死而消?
		bool			is_final_boss   = 3;        // 是否是最终BOSS
	}

	message bosses_state
	{
		repeated boss_state		created_bosses = 1;
	}
	
	message protect_npc_state
	{
		int32			npc_id          = 1;        // 被保护的NPC的ID
		int64			npc_guid        = 2;        // 被保护的NPC的GUID
		int32			npc_state_code  = 3;        // 被保护的NPC的状?
	}
	
	message update_map_record_end
	{
		repeated int32          role_guid             = 1;   // 角色guid
		repeated int32          map_record_info_data  = 2;   // 地图记录的数?
	}
	
	message update_map_record_all_end
	{
		repeated int32          map_record_info_array = 1;   	 // 地图记录的数?
		int32			is_end_record  	  	  = 2;   	 // 1代表发送完毕
		int32			map_num			  	  = 3;		 // 地图记录地图个数
	}
	
	message update_demons_tower_info_end
	{
		repeated int32          role_guid             = 1;   // 角色的GUID
		repeated int32          demons_tower_info     = 2;   // 万魔塔的数据
		bool			is_in_mopping_up	  = 3;	 // 是否在扫荡状态
	}
	
	message score_record
	{
		repeated int32			role_guid		= 1;
		string			role_name		= 2;
		int64			score			= 3;
	}
	
	message score_record_list
	{
		int32			score_list_len	= 1;
		repeated score_record	score_list		= 2;
		score_record	extra_score		= 3;
		int32			extra_rank		= 4;
		bool			is_legion_score = 5;
		int32			npc_id			= 6;
	}
	
	message temple_game_over
	{
		int32			npc_score			= 1;
		int32			win_money_id_1		= 2;
		int32			win_money_num_1		= 3;
		int32			win_money_id_2		= 4;
		int32			win_money_num_2		= 5;
	}
	message get_temple_over_gift
	{
		int32			get_over_num		= 1;
	}
	
	message get_temple_over_gift_end
	{
	}
	
	message pop_plot_tip
	{
		int32			str_id				= 1; // 要弹出的提示字符串的ID
		int32			str_id_type			= 2; // 弹出类型0是提示文字 1是弹出触发引导
	}
	
	message get_best_record
	{
		int32	map_template_id			= 1;
	}
	
	message get_best_record_end
	{
		int32	map_template_id			= 1;
		repeated string	best_record_role_name	= 2;
		repeated int64	best_record_value		= 3;
	}

	message transfer_error
	{
		int32	error_code				= 1; // 错误代码
	}

	message transfer_to_pk_king_map
	{
	}

	message pk_king_game_over
	{
		int32	award_exp				= 1;
		int32	award_money 			= 2;
	}

	message transfer_to_broken_sky_map
	{
		int32	map_id					= 1;
		int64	role_guid				= 2;
	}

	message broken_sky_boss_dead
	{
		int64	boss_guid				= 1;
	}

	message leave_map
	{
	}
	
	message get_one_map_info
	{
		int32 map_template_id			= 1;
	}
	
	message get_one_map_info_end
	{
		int32 map_template_id			= 1;
		repeated int64 map_info_arr				= 2;//包含BOSS血量，所以统一改成int64
	}
	message server_exp_level
	{
		int32 exp_level			= 1;
		float exp_percent			= 2;
		int32 exp_last_level		= 3;
	}
	message	need_hot_update
	{
		int32					update_type					= 1;
	}
	
	message gain_treasure_info_one
	{
		int32 info_type				= 1;
		int32 info_value				= 2;	
	}
	
	message gain_treasure_info_all
	{
		repeated gain_treasure_info_one info_arr = 1;
	}
	
	message add_exp_raid_buff
	{
		int32 add_count				= 1;
	}
	
	message add_exp_raid_buff_end
	{
		int32 add_count				= 1;
	}
	
	message add_legion_boss_buff_end
