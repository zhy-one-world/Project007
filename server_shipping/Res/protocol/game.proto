		int32 add_count				= 1;
		int32 demon_count				= 2;
		int32 gold_count				= 3;
	}
	
	message add_legion_boss_big_player_info
	{
		int32 class_type				= 1;
		int32 add_count				= 2;
		string player_name				= 3;
	}
	
	message gain_treasure_req_kill_record
	{
		int32 boss_spawn_point_template_id			= 1;
	}
	
	message gain_treasure_kill_record_one
	{
		int32 killed_stamp				= 1;
