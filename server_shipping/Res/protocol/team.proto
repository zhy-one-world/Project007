syntax = "proto2";
package hld;

message team_proto
{
	// 一个组队队伍中的一名成员的信息
	message member_info
	{
		optional uint64				role_guid        = 1;  // 成员的角色GUID
		optional string				role_name        = 2;  // 成员的角色名字
		optional string				gs_value		 = 3;  //成员的战力值
		repeated int64				data             = 4;  // 成员的一些需要的角色数据
	}
	
	message team_info
	{
		optional int32				team_type					= 1; // 队伍类型
		optional int32				team_sub_type_id			= 2; // 队伍子类型 (如进行活动的地图ID)
		optional uint64				team_guid					= 3; // 队伍GUID
		optional uint64				captain_guid				= 4; // 队长GUID
		optional int32				member_num					= 5; // 成员数量
		repeated member_info		member_list					= 6; // 成员数据
		optional int32				required_fighting_power		= 7; // 入队所需最低战斗力
		optional int32				required_level				= 8; // 入队所需最低等级
		optional bool				auto_matching				= 9; // 是否自动匹配中
		optional bool				is_when_join				= 10;// 是否是加入队伍时的数据
		optional int32				one_stop_flags				= 11;// 一条龙标记
	}
	
	message create_team
	{
		optional int32				team_type					= 1; // 队伍的类型
		optional int32				team_sub_type_id			= 2; // 队伍所在的大世界地图ID或将要传送到的副本的ID
		optional int32				required_fighting_power		= 3; // 加入队伍要求的最低战斗力
		optional int32				required_level				= 4; // 加入队伍要求的最低等级
		optional bool				auto_accept_new_member		= 5; // 是否自动匹配
	}
	
	message create_team_end
	{
	}
	
	message notice_create_new_team
	{
		optional uint64				team_guid				= 1; // 队伍的GUID
		optional int32				required_fighting_power	= 2; // 加入队伍所需的战斗力
		optional int32				required_level			= 3; // 加入队伍所需的等级
		optional int32				team_type				= 4; // 队伍类型
		optional int32				team_sub_type_id		= 5; // 队伍子类型 (如进行活动的地图ID)
		optional bool				is_auto_matching		= 6; // 队伍是否自动匹配
		optional int64				captain_guid			= 7; // 队长的guid
	}
	
	message join_team
	{
		optional uint64				team_guid			= 1;
		optional uint64				tar_player_guid		= 2;
	}

	message join_team_apply
	{
		optional uint64				role_guid			= 1; // 申请者的GUID
		optional int32				join_team_way		= 2; // 加入队伍的方式 0:通过队伍GUID加入 1:通过队长的GUID加入 2:同意被邀请 3:同意申请
		optional uint64				given_guid			= 3; // 提供的GUID(可能是退伍的GUID 也可能是队长的GUID)
	}
	
	message join_team_apply_end
	{
		optional uint64				applied_team_guid	= 1;
	}

	message join_team_applicant_info
	{
		optional uint64				role_guid			= 1; // 申请者的GUID
		optional uint64				team_guid 			= 2; // 申请的队伍的GUIDs
		optional int32				player_template_id	= 3; // 申请者的模板ID
		optional string				role_name			= 4; // 申请者的名字
		optional int32				level 				= 5; // 申请者的等级
	}
	
	message refused_to_join_team
	{
		optional uint64				tar_player_guid		= 1; // 被拒绝的玩家GUID
	}
	
	message refused_to_join_team_end
	{
		optional uint64				tar_player_guid		= 1; // 拒绝的玩家GUID
	}
	
	message let_role_join_team
	{
		optional uint64				team_guid			= 1;
		optional uint64				role_guid			= 2;
	}
	
	message add_team_member
	{
		optional uint64				team_guid			= 1; // 队伍的GUID
		optional member_info		member_info			= 2; // 新队员的信息
	}
	
	message del_team_member
	{
		optional uint64				team_guid			= 1;
		optional uint64				role_guid			= 2;
	}
	
	message ready
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2;
		optional int32				is_ready			= 3; // 0没有准备 1准备
	}
	
	message ready_end
	{
		optional uint64				team_guid			= 1;
		optional uint64				member_guid			= 2; // 准备的队员
		optional int32				is_ready			= 3; // 0没有准备 1准备
		optional int32				trans_check_ret		= 4; // 副本传送条件检查
	}
	
	message kickout_team_member
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2; // 队伍的GUID
		optional uint64				leaver_guid			= 3; // 要踢出的成员的GUID
	}
	
	message kickout_team_member_end
	{
	}
	
	message leave_team
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2;  // 队伍的GUID
	}
	
	message leave_team_end
	{
		optional uint64				team_guid			= 1;
	}
	
	message team_brief_info
	{
		optional uint64				team_guid				= 1; // 队伍的GUID
		optional uint64				captain_guid			= 2; // 队长的GUID	
		optional int32				player_template_id		= 3; // 队长的角色模板
		optional string				captain_name			= 4; // 队长的名字
		optional int32				captain_level			= 5; // 队长的等级
		optional int32				member_num				= 6; // 队伍中队员的人数
		optional int32				cur_map					= 7; // 队伍当前所在地图
		optional int32				required_fighting_power	= 8; // 加入队伍所需的战斗力
		optional int32				required_level			= 9; // 加入队伍所需的等级
		optional int32				team_type				= 10;// 队伍类型
		optional int32				team_sub_type_id		= 11;// 队伍子类型 (如进行活动的地图ID)
		optional int32				one_stop_flags			= 12;// 一条龙标记
	}
	
	message search_team_by_map_id
	{
		optional uint64				role_guid			= 1;
		optional int32				map_template_id		= 2; // 地图模板ID
	}
	
	message search_team_by_map_id_end
	{
		optional int32				map_template_id		= 1;
		repeated team_brief_info	team_list			= 2;
		optional int32				team_list_len		= 3;
	}
	
	message ready_to_transfer_team
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2;  // 队伍的GUID
	}
	
	message ready_to_transfer_team_end
	{
		optional uint64				team_guid          = 1;  // 队伍的GUID
		optional int32				sec                = 2;  // 多少秒后开始传送
	}
	
	message transfer_team_to_scene
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2;  // 队伍的GUID
		optional int32				map_template_id		= 3;  // 要传送到的地图的模板ID
	}
	
	message player_brief_info
	{
		optional uint64				role_guid			= 1;
		optional string				role_name			= 2;
		optional int32				head_icon			= 3;
		optional int32				level				= 4;
		optional int32				fighting_power		= 5;
		optional int32				cur_map_template_id	= 6;
	}
	
	message invite_player
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2; // 邀请来自哪个队伍
		optional uint64				invitee_guid		= 3; // 被邀请人的GUID
	}
	
	message invite_player_success
	{
		optional uint64				invitee_guid		= 1;  // 被邀请者的GUID
	}
	
	message invite_player_end
	{
		repeated team_brief_info	inviter_team_info	= 1; // 邀请人的队伍的信息
		optional uint64				sender_guid			= 2;//邀请人的GUID
	}
	
	message set_captain
	{
		optional uint64				role_guid			= 1;
		optional uint64				team_guid			= 2;
		optional uint64				new_captain_guid 	= 3;
	}
	
	message set_captain_end
	{
		optional uint64				team_guid			= 1;
		optional uint64				new_captain_guid	= 2;
	}
	
	message set_player_team_aoi_info
	{
		optional uint64				role_guid			= 1; // 角色的GUID
		optional uint64				team_guid			= 2; // 队伍GUID
		optional uint64				captain_guid		= 3; // 队长的GUID
		optional int32				member_num			= 4; // 成员数量
		optional int32				team_type			= 5; // 队伍类型
		optional int32				team_sub_type_id	= 6; // 队伍子类型
		repeated uint64				team_mems_guid		= 7; // 队伍成员guid
		optional int32				one_stop_flags		= 8; // 一条龙flags
	}
	
	message clear_player_team_aoi_info
	{
		optional uint64				role_guid			= 1;
	}
	
	message update_team_member_info_one
	{
		optional uint64				team_guid			= 1;
		optional uint64				role_guid			= 2;
		optional int32				info_index			= 3;
		optional int64				info_value			= 4;
	}
	
	message update_team_gs_value
	{
		optional uint64				team_guid			= 1;
		optional uint64				role_guid			= 2;
		optional string				gs_value			= 3;
	}
	
	message team_error
	{
		optional int32				error_type			= 1; // 错误类型
	}
	
	message team_member_pos_info
	{
		optional uint64				role_guid			= 1;  // 成员的角色GUID
		optional int32				pos_x				= 2;  // 当前坐标x
		optional int32				pos_y				= 3;  // 当前坐标y
		optional int32				pos_z               = 4;  // 当前坐标z
	}
	
	message team_pos_info
	{
		repeated team_member_pos_info	member_list	 	= 1; // 成员位置数据
		optional int32					member_num	 	= 2; // 成员数量
	}
	
	message get_no_team_mate_list
	{
		optional uint64				role_guid			= 1;
		optional int32				mate_type			= 2;
	}
	message get_no_team_mate_list_end
	{
		repeated uint64				mates_guid_arr 		= 1;
		optional int32				mate_type			= 2;
	}
	
	message get_team_list_by_aim
	{
		optional uint64				role_guid			= 1;
		optional int32				team_type_id		= 2;
		repeated int32				team_sub_type_id	= 3;
	}
	
	message get_team_list_by_aim_end
	{
		optional int32				team_type_id		= 1;
		repeated team_brief_info	team_list			= 2;
	}
	
	message auto_match_team
	{
		optional uint64				role_guid			= 1;
		optional int32				team_type_id		= 2;
		optional int32				team_sub_type_id	= 3;
		optional bool				match_state			= 4;
	}
	message auto_match_team_end
	{
		optional int32				match_ret			= 1;
	}
	
	message update_team_attribute
	{
		optional int32				team_type_id		= 1;
		optional int32				team_sub_type_id	= 2;
		optional bool				is_auto_match		= 3;
		optional int32				limit_fight_power	= 4;
		optional int32				limit_level			= 5;
	}
	message update_team_attribute_end
	{
		optional int32				n_team_type_id		= 1;
		optional int32				n_team_sub_type_id	= 2;
		optional bool				n_is_auto_match		= 3;
		optional int32				n_limit_fight_power	= 4;
		optional int32				n_limit_level		= 5;
		optional int32				n_one_stop_flags	= 6;
	}
	
	message team_mem_operate
	{
		optional uint64				role_guid			= 1;
		optional int32				operate_type		= 2;
		repeated int32				operate_params		= 3;
	}
	message team_mem_operate_end
	{
		optional uint64				req_role_guid		= 1;
		optional int32				operate_type		= 2;
		repeated int32				operate_params		= 3;
	}

	message self_os_flags_update
	{
		optional int32				own_os_flags		= 1;
	}
}