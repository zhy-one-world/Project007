syntax = "proto3";
package faith;
import "character.proto";
import "item.proto";
message aoi_proto
{	
	message unit_location
	{
		int32			pos_x			= 1;	
		int32			pos_y			= 2;	
		int32			pos_z			= 3;	
	}
	message unit_rotation
	{
		int32			yaw					= 1;		
	}
	message unit_rotation_end
	{
		int64 			unit_guid 			= 1;
		int32			yaw					= 2;		
	}
	message aoi_pos_update
	{
		int64 							unit_guid = 1;
		repeated int32							move_vector = 2;
	}
	
	message player_legion_info
	{
		uint64							legion_guid	= 1; // 玩家的军团GUID
		string							legion_name	= 2; // 玩家的军团名称
		int32							job_title	= 3; // 玩家在军团中的职位
	}
	
	message player_team_info
	{
		uint64							team_guid	= 1; // 玩家的组队GUID
		uint64							captain_guid= 2; // 队长GUID
		int32							member_num	= 3; // 成员数量
	}
	message unit_aoi_all
	{
		int64							unit_guid = 1;	// 角色ID
		int32							runtime_id = 2;//运行时id
		string							role_name = 3;// 名字
		int32							template_id = 4;//模板id
		int32							n_type = 5;//大类型
		int32							sub_type = 6;//子类型
		int32							exp_level = 7;//经验等级
		int32							branch_type = 8;//分支类型
		int32							vip_level = 9;//vip等级
		int32							wing_template_id = 10;//翅膀模板id
		int32							mount_template_id = 11;//坐骑模板id
		int32							n_born_anim = 12;//是否有出生动画
		int32							n_item_id = 13;//如果是掉落包，包含了什么物品
		int32							show_weapon_id = 14;
		int32							gs_value = 15;
		int64							owner_guid = 16;//如果是掉落包，拥有者Guid
		repeated int32							location = 17;//位置
		int32							yaw = 18;//朝向
		repeated float							att_attack = 19;//速度
		repeated float							att_info = 20;//状态属性
		repeated bool							att_state = 21;//bool状态
		repeated int64							att_base = 22;//存档属性
		player_legion_info				legion_info = 23;//军团信息
		player_team_info				team_info	= 24;//队伍信息
		repeated int32							special_name = 25;//special_name
		int32							title_template_id = 26;//稀有称号
		repeated item_proto.item_info			item_list = 27;//显示的物品
		character_proto.spirit_info	spirit_info = 28;//精靈
		int32							robot_template_id = 29;//机器人模版id
		repeated int32							special_star = 30;	//special_star
		int32							tinder_template_id = 31;//火种模板id
		repeated int32							belief_info = 32;	//信仰数据
		bool							is_dissolve = 33;	//是否要溶解进入
		string							couple_name = 34;	//情侣的名字
		int64							interaction_object_guid = 35;
		int32							interaction_type = 36;
		int32							interaction_invite_type = 37;
		int32							residue_am_time = 38;//距离播放出场动画剩余的时间
		int32							type = 39;	//返回类型 0-创建 1-Simple转Normal
		int32							upgrade_id = 40;
		int32							show_fashion =41;
		int32							head_frame_id =42;
		int32							server_id = 43;//玩家所属服务器id
		int32							npc_temp_id = 44;//雕像所属NPCid
		string							role_appearance = 45;	//捏脸外貌
		bool							can_show_head = 46;	//是否可以显示血条
		int64							is_mission_see_player_guid = 47;//任务怪
		repeated int32							award_item_list =48;//npc携带的奖励列表
	}
	message unit_aoi_in
	{
		repeated unit_aoi_all						unit_list = 1;
	}
	message unit_aoi_out
	{
		repeated int64 							unit_guid = 1;
		bool							is_dissolve = 2;	//是否要溶解消失
	}	
	message aoi_move
	{
		int64 							unit_guid = 1;
		repeated int32 							cur_pos = 2;
		repeated int32 							dest_pos = 3;
		float							move_time = 4;
		float							move_yaw = 5;
		float							move_length = 6;
		bool							be_back = 7;
		bool							is_not_sync_rotation = 8;
		bool							is_client_driver = 9;
	}
	message show_player
	{
		int32 							show_num = 1;
	}
	message face_unit
	{
		int64 							unit_guid = 1;
		int32							move_yaw = 2;
	}

	message marry_unit
	{
		bool							is_marry = 1;						
		int64 							unit_guid = 2;			//有结婚事件发生
		string 						couple_name = 3;		
	}
	message simple_unit_pos
	{
		repeated int64 							unit_guid = 1;
		repeated int32 							runtime_id = 2;
	}
	message simple_unit_pos_end
	{
		repeated int64 							unit_guid = 1;
		repeated int32 							pox_x = 2;
		repeated int32 							pox_y = 3;
		repeated int32 							pox_z = 4;
		bool 							att_state = 5;//是否处于死亡状态
		float 							att_info = 6;//是否在骑乘飞行状态
	}

	message unit_change_appearance
	{
		int32							appearance_id = 1;	//捏脸外貌
		int64 							unit_guid = 2;
	}
	
	message update_can_show_head
	{
		int64 							unit_guid = 1;
		bool 							can_show = 2;
	}
}


