syntax = "proto2";
package hld;

message cloud_shop_proto
{
	message cloud_shop_req
	{
		optional int32 req_type				= 1;   //0:请求活动数据; 1:购买; 2:抢购;
	}

	message cloud_shop_resp
	{
		optional int32 error_id					= 1;
		optional int32 req_type					= 2;   //0:请求活动数据; 1:购买; 2:抢购;
		optional int32 day_index				= 3;
		optional int32 activity_state			= 4;
		optional int32 total_num				= 5;
		optional int32 left_for_sell_num		= 6;
		optional int32 have_buy_count			= 7;
		optional int32 have_robber_count		= 8;
		optional int32 left_time_to_next_step	= 9;
		optional string award_info				= 10;
		optional int32 template_id				= 11;
	}
}