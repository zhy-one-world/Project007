syntax = "proto3";
package faith;

message cloud_shop_proto
{
	message cloud_shop_req
	{
		int32 req_type				= 1;   //0:请求活动数据; 1:购买; 2:抢购;
	}

	message cloud_shop_resp
	{
		int32 error_id					= 1;
		int32 req_type					= 2;   //0:请求活动数据; 1:购买; 2:抢购;
		int32 day_index				= 3;
		int32 activity_state			= 4;
		int32 total_num				= 5;
		int32 left_for_sell_num		= 6;
		int32 have_buy_count			= 7;
		int32 have_robber_count		= 8;
		int32 left_time_to_next_step	= 9;
		string award_info				= 10;
		int32 template_id				= 11;
	}
}

