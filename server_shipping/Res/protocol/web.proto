syntax = "proto3";
package faith;
message web_proto
{
	message login
	{
		int32 bigGroupId = 1;
		int32 serverGroupId = 2;
	}
	message json_str_http_to_ws
	{
		int32 jsonType = 1;
		string dataStr = 2;		
		int64 orderNum = 3;
	}
	message json_str_ws_to_http
	{
		int32 jsonType = 1;
		string dataStr = 2;	
		int32 bigGroupId = 3;
		int32 serverGroupId = 4;	
		int64 orderNum = 5;
	}
}

