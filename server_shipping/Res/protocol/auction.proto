syntax = "proto3";
package faith;

message auction_proto
{
	message operate
	{
		int64				item_guid					= 1;
		int32				item_num					= 2;
		int32				operate_type				= 3;
		int32				money_type					= 4;
		int64				money_num					= 5;
	}
	
	message operate_end
	{
		int64				item_guid					= 1;
		int32				item_num					= 2;
		int32				operate_type				= 3;
		int32				money_type					= 4;
		int64				money_num					= 5;
		int32				operate_result				= 6;
	}
	
	message auction_item_info
	{
		int64						seller_guid					= 1;
		string						seller_name					= 2;
		int64						buyer_guid					= 3;
		string						buyer_name					= 4;
		int32						trade_type					= 5;
		int32						seller_vip_level			= 6;
		int32						auction_tab					= 7;
		int32						auction_sub_tab				= 8;
		int32						item_color					= 9;
		int32						quality_level				= 10;
		int32						class_limit					= 11;
		string						item_name					= 12;
		int64						sell_time					= 13;
		int64						deal_time					= 14;
		int32						sell_money_type				= 15;
		int64						sell_total_money			= 16;
		int64						sell_single_money			= 17;
		int64						cur_bid_money				= 18;
		int64						item_guid					= 19;
		repeated int32						item_info					= 20;
		bool						is_sell						= 21;
		int32                      is_show                     = 22;
	}
	
	message update_selling_auction_list
	{
		bool						is_need_clean				= 1;	
		repeated auction_item_info			item_list					= 2;
	}
	
	message receieve_sell_success_info
	{
		int32						item_template_id			= 1;
	}
	
	message req_auction_list
	{
		int32						main_type					= 1;
		int32						sub_type					= 2;
		int32						item_color					= 3;
		int32						quality_level				= 4;
		int32						single_money_sort_type		= 5;
		int32						total_money_sort_type		= 6;
		bool						is_show_gold				= 7;
		bool						is_show_diamond				= 8;
		int32						show_page					= 9;
		string						key_word					= 10;
		int32						trade_type					= 11;
		int32                      career_type                 = 12;
	}
	
	message req_auction_list_end
	{
		repeated auction_item_info			item_list					= 1;
		int32						cur_page					= 2;
		int32						max_info_num				= 3;
		bool						is_final					= 4;
		bool						is_need_clear				= 5;
	}
	
	message req_trade_record
	{
		int32						trade_type					= 1; 
		int32						page_index					= 2;
	}
	
	message req_trade_record_end
	{
		int32						total_record_num			= 1; 
		int32						cur_page_index				= 2; 
		repeated auction_item_info			item_list					= 3;
	}
	
	message req_another_sell_info
	{
		int32						sell_money_type				= 1;
		int32						item_template_id			= 2;
	}
	
	message req_another_sell_info_end
	{
		int32						sell_money_type				= 1;
		int32						item_template_id			= 2;
		repeated auction_item_info			item_list					= 3;
		bool						is_final					= 4;
		bool						is_need_clear				= 5;
	}
	
	message trade_operate
	{
		int64				trade_guid							= 1;
		int32				operate_type						= 2;
		int32				price_money_type					= 3;
		int64				price_money_value					= 4;
	}
	
	message trade_operate_end
	{
		int64				trade_guid							= 1;
		int32				operate_type						= 2;
		int32				operate_result						= 3;
	}
	
	message req_self_bid_list
	{
		int32						trade_type					= 1;
		int32						page_index					= 2;
	}
	
	message bid_are_overtaken
	{
		int32				item_id								= 1;
		int32				item_num							= 2;
	}
	
	message auction_sell_flag
	{
		bool				sell_flag							= 1;
	}
	
	message auction_item_single
	{
	    int32                      create_time                 = 1;
		int32                      is_read                     = 2;
		int32						trade_type					= 3;
		int32						sell_time					= 4;
		int32						deal_time					= 5;
		int32						sell_money_type				= 6;
		string                     cur_bid_money_str           = 7;
		repeated int32						cur_bid_money				= 8;
		repeated int32						item_info					= 9;
	}
	message auction_bid_record_failure 
	{
	    repeated auction_item_single       auction_record_array         = 1;
	}
	
	message auction_bid_single 
	{
	    repeated int32           item_guid                   = 1;
		int32           create_time                 = 2;
		int32           template_id                 = 3;
		int32           template_num                = 4;
		int32           money_type                  = 5;
		string          bid_money                   = 6;
		int32           is_sell                     = 7;
		repeated int32           buyer_guid                  = 8;
		int32           update_time                 = 9;
		int32           is_read                     = 10;
		
	}
	message auction_bid_notice
	{
	    repeated  int32                role_guid             = 1;
	    repeated  auction_bid_single   bid_notice_array      = 2;
	}
	message auction_bid_notice_red
	{
	    repeated  int32               role_guid              = 1;
		repeated  int32               is_red                 = 2;
	}
	
}

