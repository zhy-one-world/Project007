syntax = "proto3";
package faith;

message talent_proto
{
	message talent_info_one
	{
		repeated	int32						data_ary = 1;
	}
	message talent_info_all
	{
		repeated talent_info_one	talent_array	= 1;
	}

	message level_up
	{
		int32 talent_template_id = 1;
		int32 talent_list_template_id = 2;
		int32 layer_index = 3;
	}
	message level_up_end
	{
		int32 operate_result = 1;
		int32 old_talent_template_id = 2;
		int32 new_talent_template_id = 3;
	}
	message reset_money
	{
	}


	//ͬ����Ѫ��value
	message suck_blood_value
	{
		uint64	sender_guid = 1;			
		int32	suck_blood_value = 2;	//���յ�hp value
	}

}


